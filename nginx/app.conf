# Shared application config — included by the dev server block (nginx.conf)
# and by the HTTPS server block that install.sh generates in production.

root /usr/share/nginx/html;
index index.html;

client_max_body_size 1m;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# chunked customer uploads — must precede /api/
location /api/upload/ {
    client_max_body_size 64m;
    client_body_timeout 300s;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://backend:8000;
}

# admin media uploads (posters, previews, stills, hero loop, content images)
location /api/admin/media/ {
    client_max_body_size 210m;
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_pass http://backend:8000;
}

location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_pass http://backend:8000;
}

location = /sitemap.xml {
    proxy_set_header Host $host;
    proxy_pass http://backend:8000;
}

# public admin-uploaded assets (uuid filenames -> immutable)
location /media/ {
    alias /data/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# X-Accel-Redirect target for customer file downloads
location /protected-files/ {
    internal;
    alias /data/uploads/;
}

location ~ ^/work/[a-z0-9-]+/?$ {
    try_files /project.html =404;
}

location ~ "^/u/[A-Za-z0-9_-]{20,64}$" {
    try_files /upload.html =404;
}

location = /admin {
    return 301 /admin/;
}

location ~* \.(css|js|svg|woff2)$ {
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
}

location ~* \.html$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}

error_page 404 /404.html;

location / {
    try_files $uri $uri/ =404;
}
