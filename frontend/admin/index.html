<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Vova Media</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-box" id="login-form">
      <span class="nav-mark" data-logo></span>
      <h1>Vova Media Admin</h1>
      <label class="lbl" for="pw">Password</label>
      <input class="field" type="password" id="pw" autocomplete="current-password" autofocus>
      <div class="form-actions" style="justify-content:center">
        <button class="btn btn-solid" type="submit">Sign in</button>
      </div>
    </form>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/admin/login.js"></script>
</body>
</html>
